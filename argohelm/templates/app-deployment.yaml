apiVersion: apps/v1
kind: Deployment
metadata:
  name: argoapp
spec:
  selector:
    matchLabels:
      app: argoapp
  template:
    metadata:
      labels:
        app: argoapp
    spec:
      containers:
      - name: argoapp
        image: theoafactor/argoapp
        ports:
        - containerPort: 80
